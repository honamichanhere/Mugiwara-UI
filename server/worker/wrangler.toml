name = "mugiwara-chat"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Paste the id printed by:  npx wrangler d1 create mugiwara-chat
[[d1_databases]]
binding = "DB"
database_name = "mugiwara-chat"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
MAX_LENGTH = "200"    # characters per message
COOLDOWN_MS = "1500"  # minimum time between two messages of the same user
